<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Where Ampcontrol works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,400;0,500;0,600;1,600&display=swap" rel="stylesheet">
<style>
:root { --bg: #021A45; --ink: #FFFFFF; --muted: #B9CBEA; --orange: #F06F0B; --coral: #FF6B4A; color-scheme: dark; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #021A45; --ink: #FFFFFF; } }
:root[data-theme="dark"] { --bg: #021A45; --ink: #FFFFFF; }
*, *::before, *::after { box-sizing: inherit; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; cursor: none; }
body { font-family: 'Kanit', Arial, Helvetica, sans-serif; color: var(--ink); }
.stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform: translate(-50%, -50%) scale(var(--s, 1)); transform-origin: center; overflow: hidden; }
.scene { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
.site-label.small { font-size: 16px; }
.floww { animation: rflow 2.4s linear infinite; } @keyframes rflow { to { stroke-dashoffset: -56; } }
.coal { animation: coalbelt 1.1s linear infinite; }
@keyframes coalbelt { to { stroke-dashoffset: -12.2; } }
.coalfall { animation: coaldrop .45s linear infinite; }
@keyframes coaldrop { to { stroke-dashoffset: -8.2; } }
.puff { transform-box: fill-box; transform-origin: center; opacity: 0; animation: puff 5.5s linear infinite; }
@keyframes puff { 0% { transform: translate(0, 0) scale(.5); opacity: 0; } 12% { opacity: .4; } 60% { opacity: .18; } 100% { transform: translate(16px, -62px) scale(2.3); opacity: 0; } }
.bb-msg { font-family: 'Kanit', Arial, sans-serif; font-weight: 500; fill: #FFFFFF; letter-spacing: .4px; transition: opacity .45s ease; }
.bb-msg.out { opacity: 0; }
.site-label { font-family: 'Kanit', Arial, sans-serif; font-weight: 600; font-style: italic; font-size: 23px; fill: #fff; letter-spacing: .6px; paint-order: stroke; stroke: #021A45; stroke-width: 5px; stroke-linejoin: round; }
.title { position: absolute; left: 56px; top: 34px; }
.title h1 { margin: 0; font-size: 46px; line-height: 1.05; font-weight: 600; font-style: italic; text-transform: uppercase; letter-spacing: .6px; }
.title svg { display: block; margin-top: 10px; }
.count { position: absolute; right: 40px; bottom: 6px; display: flex; align-items: center; gap: 12px; padding: 4px 18px 4px 14px; border-radius: 999px; background: rgba(2,26,69,.0); font-size: 18px; color: var(--muted); }
.count b { color: #FFB27A; font-weight: 600; font-size: 24px; display: inline-block; transition: transform .3s; }
.count b.bump { transform: scale(1.4); }
.count .pulse { width: 11px; height: 11px; border-radius: 50%; background: var(--coral); animation: livepulse 1.8s ease-out infinite; }
@keyframes livepulse { 0% { box-shadow: 0 0 0 0 rgba(255,107,74,.7); } 100% { box-shadow: 0 0 0 12px rgba(255,107,74,0); } }
.acf { animation: acflow 1.5s linear infinite; } .ach { animation: acflowh 1.1s linear infinite; } .acspin { animation: acspin 7s linear infinite; }
@keyframes acflow { to { stroke-dashoffset: -44; } } @keyframes acflowh { to { stroke-dashoffset: -32; } } @keyframes acspin { to { transform: rotate(360deg); } }
.veh .beacon { animation: blink .9s steps(2, jump-none) infinite; }
@keyframes blink { 0% { opacity: 1; } 100% { opacity: .25; } }
.rdoor, .rglow { transition: opacity .45s ease; }
.scene.door-open .rdoor { opacity: 0; } .scene.door-open .rglow { opacity: .55; }
/* job cards */
.job { position: absolute; z-index: 2; display: flex; gap: 14px; align-items: flex-start; width: 330px; padding: 13px 16px 14px 13px; border-radius: 16px; background: linear-gradient(140deg, #F06F0B 0%, #FF6B4A 100%); color: #fff; box-shadow: 0 14px 34px rgba(2,26,69,.45); transform: translate(-50%, -50%) scale(.4); opacity: 0; }
.job.in { animation: jobin .5s cubic-bezier(.2,1.6,.4,1) forwards, jobglow 1.2s ease-out .1s 1; }
.job.out { animation: jobout .45s ease-in forwards; }
@keyframes jobin { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.4); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
@keyframes jobout { to { opacity: 0; transform: translate(-50%, -50%) scale(.85); } }
@keyframes jobglow { 0% { box-shadow: 0 14px 34px rgba(2,26,69,.45), 0 0 0 0 rgba(255,140,90,.75); } 100% { box-shadow: 0 14px 34px rgba(2,26,69,.45), 0 0 0 24px rgba(255,140,90,0); } }
.job .ico { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%; background: #021A45; display: grid; place-items: center; }
.job .ico svg { width: 22px; height: 22px; }
.job .txt { flex: 1 1 auto; min-width: 0; }
.job .loc { display: block; font-size: 14px; font-weight: 600; font-style: italic; letter-spacing: .6px; text-transform: uppercase; color: #021A45; }
.job strong { display: block; font-size: 20px; font-weight: 500; line-height: 1.2; margin-top: 2px; }
.job em { display: block; font-style: normal; font-weight: 300; font-size: 15px; line-height: 1.25; margin-top: 3px; }
.job .row { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
.job .bar { flex: 1 1 auto; height: 7px; border-radius: 4px; background: rgba(2,26,69,.3); overflow: hidden; }
.job .bar i { display: block; height: 100%; width: 0; background: #fff; border-radius: 4px; }
.job .st { font-size: 15px; font-weight: 500; white-space: nowrap; }
.job.done { background: linear-gradient(140deg, #0B4FB8 0%, #006CD3 100%); }
.job.done .loc { color: #9FD0FF; } .job.done .ico { background: #fff; }
.mk .ping { fill: none; stroke: #FF6B4A; stroke-width: 3; transform-box: fill-box; transform-origin: center; animation: ping 1.6s ease-out infinite; }
.mk .ping.p2 { animation-delay: .8s; }
@keyframes ping { 0% { transform: scale(.4); opacity: 1; } 100% { transform: scale(2.6); opacity: 0; } }
.mk .pin { animation: bob 1.4s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.mk.done .ping { display: none; } .mk.done .pin { animation: none; }
.mk, .leader { transition: opacity .4s; }
@media (prefers-reduced-motion: reduce) { .puff { animation: none; opacity: .2; } .coal, .coalfall, .acf, .ach, .acspin, .veh .beacon, .count .pulse, .mk .ping, .mk .pin { animation: none; } .job.in { animation: none; opacity: 1; transform: translate(-50%, -50%); } .job.out { animation: none; opacity: 0; } }
</style>
</head>
